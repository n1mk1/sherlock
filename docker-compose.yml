# Local dev: API and web with hot reload. The production image is api/Dockerfile.
services:
  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app/api
    command: sh -c "uv sync --frozen && uv run uvicorn sherlock.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/sherlock.db
      UV_PROJECT_ENVIRONMENT: /venv
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./data:/data
      - api-venv:/venv

  web:
    image: node:24-bookworm-slim
    working_dir: /app/web
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app/web
      - web-node-modules:/app/web/node_modules
    depends_on:
      - api

volumes:
  api-venv:
  web-node-modules:
