# Render Blueprint: Sherlock's host.
# One Docker web service built from api/Dockerfile, serving the API and the web app from one
# origin, with a persistent disk at /data. A service with a disk is single-instance, which the
# app requires (one process holds the job runner and the SSE bus).
# The Nebius alternative is scripts/deploy.sh.
services:
  - type: web
    name: sherlock
    runtime: docker
    region: frankfurt
    # Standard (1 CPU, 2 GB) since 2026-10-25, for the sandbox and the Cleaner.
    plan: standard
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Deploy main only after CI passes, and only when the app itself changed.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - api/**
        - web/**
        - render.yaml
    disk:
      name: sherlock-data
      mountPath: /data
      sizeGB: 5
    envVars:
      # The image listens on 8080; Render routes public traffic to $PORT.
      - key: PORT
        value: "8080"
      # Standard has 2 GB for everything: the API, its DuckDB connections and one sandbox
      # worker. Each cap stays well under that, so a runaway step fails with MemoryError
      # instead of getting the whole container killed.
      - key: DUCKDB_MEMORY_MB
        value: "512"
      # The sandbox's extra memory per step (the 2048 default assumes a 16 GB host).
      - key: SANDBOX_MEM_MB
        value: "1024"
      # Set in the Render dashboard when the Blueprint is created; never in the repo.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: MODEL_LARGE
        value: nvidia/Nemotron-3-Ultra-550b-a55b
      - key: MODEL_MEDIUM
        value: nvidia/nemotron-3-super-120b-a12b
      - key: MODEL_SMALL
        value: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
      - key: MODEL_EMBED
        value: ""
      - key: NVIDIA_EMBED_MODELS
        value: ""
      - key: LLM_TOOLS_MODE
        value: native
      # Web search, extract and map through Tavily. Empty or unset: every web feature is off and
      # says so in one line. Set it in the Render dashboard to turn web on; never in the repo.
      - key: TAVILY_API_KEY
        sync: false
