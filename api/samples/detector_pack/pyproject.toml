# An example detector pack (TRD §7.1 step 4). Install it beside Sherlock (`uv pip install -e api/samples/detector_pack`),
# set DETECTOR_PLUGINS=example (or all), and check it with `uv run sherlock detectors check`.
[project]
name = "sherlock-example-pack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."sherlock.detectors"]
example = "sherlock_example.detectors:SPECS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sherlock_example"]
