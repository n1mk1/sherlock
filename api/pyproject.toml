[project]
name = "sherlock"
version = "0.1.0"
description = "Sherlock: an AI data analyst whose every number comes from executed code."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy==2.1.3",
    "openai>=3.37.0",
    "pandas==2.2.3",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sherlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Token Factory API (deselected by default; run with -m live)",
]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
