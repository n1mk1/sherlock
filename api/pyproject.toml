[project]
name = "sherlock"
version = "0.1.0"
description = "Sherlock: an AI data analyst whose every number comes from executed code."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "charset-normalizer>=3.5.2",
    "dateparser==1.2.0",
    "duckdb==1.1.3",
    "fastapi>=0.162.0",
    "ftfy==6.3.1",
    "matplotlib==3.9.2",
    "nbformat>=5.11.1",
    "numpy==2.1.3",
    "openai>=3.37.0",
    "pandas==2.2.3",
    "pandera[pandas]>=0.34.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz==3.10.1",
    "scikit-learn==1.5.2",
    "sqlglot>=30.24.0",
    "tavily-python==0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sherlock = "sherlock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sherlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Token Factory API (deselected by default; run with -m live)",
]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
]
